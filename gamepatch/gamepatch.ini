; gamepatch: in-memory performance patches for Rise of the Witch-king 2.02, loaded by the
; dinput8.dll next to this file. 1 = on, 0 = off. Environment variables win over this file:
; GAMEPATCH=0 turns every patch off, GAMEPATCH_<NAME>=0/1 one of them (e.g. GAMEPATCH_HITTEST=0).
; All patches give bit-identical game results, so patched and unpatched players can play together.
;   dxlock    DirectX lock without the Win32 mutex (a wineserver round trip per call without msync)
;   invsqrt   SSE fast inverse square root (the x87 original is ~12x slower under Rosetta)
;   normtail  SSE for the vector scaling after the two hottest inverse square roots
;   hittest   SSE UI button hit test with a bounding-box early out
;   quatmat   SSE quaternion -> matrix (animation)
;   shutdown  no crash on exit (a Release into the already unloaded d3d9.dll)
;   limiter   the frame limiter sleeps instead of spinning while the game is under 30 FPS
;             (menus, small fights: much less CPU). OFF by default: in a standalone test 2 of
;             1050 frames ended 5 and 22 ms late because a Sleep(1) woke up late; try it in game.
;   floor     floor/ceil via SSE4.1 (exact)
;   perfmarker  the per-draw D3DPERF marker names (string copies, sprintf) are not built while
;             no D3DPERF consumer is attached (always, unless PIX or passtimers)
;   passtimers  diagnostic, OFF by default: times every named render pass (RenderViews,
;             RenderTerrain, RenderWater, mesh draws, ...) and writes per-frame inclusive/self ms
;             to the log every 5 s. Makes the frame a little slower while on (the markers run).
;   animdedup   a unit's animation is not evaluated a second time at the same game time when its
;             inputs are unchanged (the pose is still copied to its meshes as before)
;   animdecode  motion channels queried without the per-unit cache (blends) continue from their
;             last decoded frame instead of decoding from frame 0 each time
;   particlevtx particle vertex colours packed with SSE instead of switching the x87 rounding
;             mode twice per vertex (exact)
;   flattenlight  a building placement levels the ground under it cell by cell, and the game
;             relit every road on the map after each lowered cell (30-100 times per building on a
;             hilly map: freezes of 0.2-1.4 s). Now the roads are relit once, when the levelling
;             ends, from the same heights and lights: the same road colours (exact)
;   mipfilter the mip levels of the game's own textures (the terrain tiles near the camera, two per
;             tile, rebuilt 30-90 at a time after a camera jump; house-colour recolours) made as
;             Wine's d3dx9 makes them, without its per-pixel conversion: ~2 ms -> 0.04 ms a texture,
;             the same bytes (exact; only with Wine's builtin d3dx9_27, after a self-test)
;   edgemap   shadow volumes: silhouette edges chained through an index instead of a search over
;             all edges (identical volumes; 2-15x less time per volume)
;   shadowpar shadow volumes of all units built on several CPU cores (a worker pool) instead of
;             one after the other. OFF by default until tried in game. For the first
;             shadowpar_verify frames with shadows every volume is also built the original way and
;             compared byte for byte; a difference (or a fault on a worker) switches shadowpar off
;             for the session and is logged. shadowpar_workers: 0 = cores - 1, at most 7;
;             shadowpar_sample: every Nth frame runs serially, for the timing lines in the log.
;   shadowstats counters only: every 60 s the log gets the shadow settings in effect (volumes,
;             decals, shadow mapping), how often the volume and shadow-map passes ran, and the
;             edgemap / shadowpar counts. Note: with shadow mapping on (EA's UltraHigh level) the
;             game turns volume shadows off, so edgemap and shadowpar have nothing to do.
;   renderstats counters only: every 60 s, per frame, how many visibility passes, FX flushes and
;             FX draws (rigid / CPU-skinned / GPU-skinned) the main passes and the shadow-map pass
;             make, and how many meshes and vertices are skinned on the CPU in each; where the
;             time of each pass goes (ms per frame in WW3D::Render, Customized_Render, the
;             visibility check, renderOneObject with the object count, Flush, the FX flushes) and
;             how many unit poses (animations) each pass evaluates; plus a log line whenever the
;             display's shadow-mode switch or the static LOD level changes (with the calling
;             address and the shadow flags before and after). The timers cost ~0.02 ms a frame.
;   particlestats counters only: every 60 s, per frame, main view | shadow-map pass: time in the
;             particle manager's render, in the RenderObject particle draw module (systems,
;             particles, and its colour setters), in the sorting-renderer flush that the
;             RenderParticles marker also covers (with the sorted nodes it drew) and in W3D model
;             emitter renders; plus (every 16th frame) the particle systems by draw module kind.
;   monitor   counters only, for scripts/monitor.sh: while GAMEPATCH_MONITOR names a file (the play
;             script sets it), one line per drawn frame with the logic frame and the D3DX texture
;             loads / creations / effect creations since the previous frame and the time in them,
;             the object count once a second and the 32-bit address space every 2 s. Needs
;             renderstats. ~1 us per frame; nothing without GAMEPATCH_MONITOR.
;   stalls    part of monitor (only while it is on): when a frame takes over 150 ms
;             (GAMEPATCH_STALL_MS), a watchdog thread samples the main thread every 2 ms
;             (GAMEPATCH_STALL_EVERY_MS) until the frame ends, at most 4 s: its instruction pointer
;             and the return addresses on its stack, for the session report's per-stall function
;             histogram (tools/monitor_stalls.py). Each sample holds the main thread for the time
;             of a GetThreadContext and a 32 KB copy (the exit log gives the mean). Nothing
;             otherwise: the watchdog wakes every 10 ms to compare two clocks.
;   Game-logic x87 code in SSE / integer arithmetic (bit-identical results in the game's FPU mode;
;   any other mode, and any input whose result could differ, runs the original x87 code). Every
;   60 s the log gets a "logicmath:" line with the calls of each and how many ran the original.
;   mat2quat  matrix -> quaternion (animation blending)
;   distcalc  the range-scan distance functions (centre and bounding-circle 2D distance)
;   bsphere   the square root in a render object's bounding sphere
;   worldcell world position -> pathfinder cell
;   ftol2     every float -> integer conversion of the exe (the CRT's x87 _ftol2)
;   crtsqrt   the exe's sqrt import (Wine's msvcr71 sqrt: an x87 fsqrt) in SSE with Wine's exact
;             result; only under Wine (on Windows the game's own sqrt stays), after a self-test
;   octile    the pathfinding cost of one path segment (0x7658c3: x87 and four CRT fabs calls) in
;             SSE; only under Wine. Both log an "lmath2:" line every 60 s
;   shroudspan the shroud's per-cell vision counters (redrawn each time a unit crosses a 40-unit
;             cell) in a tight loop instead of two calls per cell and player; "shroudspan:" every 60 s
;   scantree  the quadtree walk of every range scan (target acquisition, auras, fear, detection)
;             with the 2D distances, filter chain and result append inline; "scantree:" every 60 s
;   pathfind  the pathfinder search step's footprint check and crowd cost with every per-unit
;             answer kept for the rest of the search, ground cells read inline, the crowd maths in
;             SSE (exact in the game's FPU mode): the same paths, faster; counts in the exit log
;   moveawaycap   a unit told to step aside searches at most 800 cells for a free spot (EA: no
;             limit; a search inside a packed army could take seconds). CHANGES GAME LOGIC: every
;             player in a LAN game must have the same setting
;   moveawayqueue a new path through idle allies orders at most 2 of them aside at once, the rest
;             2 per pathfinder queue run (one per logic phase). CHANGES GAME LOGIC: as above
;   pathsplit a unit's long path search (findPath, closest path) stops after pathsplit_cells popped
;             cells in a logic phase and goes on in the next instead of freezing that frame (EA:
;             one search always runs to its end, 0.1 s and more for a horde in a packed army).
;             Such paths arrive a few phases later. CHANGES GAME LOGIC: as above, and every
;             player needs the same pathsplit_cells
;   firecircle  Angmar's Freezing Rain and Blizzard damp every fire on the map every 2 s for the
;             spell's 150 s; the game asked the terrain for the height and water at all ~260,000
;             fire cells each time (a 100-150 ms freeze every 2 s). Now only cells that burn are
;             asked, and the circle's off-map rows are skipped: the same fires put out (exact)
;   logicstats diagnostic, OFF by default: every 30 s the log gets the game logic's ms per logic
;             step in each of its 6 phases (one phase runs per drawn frame), the frame interval
;             after each phase (mean, max, frames over 40 / 50 ms), the ms of each subsystem the
;             logic updates and of the 12 slowest update-module classes. Counters only; ~20 ns per
;             module update while on. scripts/measure-session.sh on|off switches it with the rest.
;   highmem   diagnostic, OFF by default: at start-up the free address space below 2 GB is
;             reserved (never committed; kept until exit) and the process heap's low free space
;             used up, so the game's memory comes from above 0x80000000 minutes into a session
;             instead of late in a long match: tests the game's code with pointers above 2 GB
;             (docs/MEMORY-4GB.md). Only in a large-address-aware exe; changes no game code.
;             highmem_slack: MB left free below 2 GB (one block) for DLLs loaded later and small
;             allocations. The log's "highmem:" line says what was reserved and what is left.
[patches]
dxlock=1
invsqrt=1
normtail=1
hittest=1
quatmat=1
shutdown=1
limiter=0
floor=1
perfmarker=1
passtimers=0
animdedup=1
animdecode=1
particlevtx=1
flattenlight=1
mipfilter=1
edgemap=1
shadowpar=0
shadowpar_verify=300
shadowpar_workers=0
shadowpar_sample=150
shadowstats=1
renderstats=1
particlestats=1
monitor=1
stalls=1
mat2quat=1
distcalc=1
bsphere=1
worldcell=1
ftol2=1
crtsqrt=1
octile=1
shroudspan=1
scantree=1
firecircle=1
pathfind=1
moveawaycap=1
moveawayqueue=1
pathsplit=1
pathsplit_cells=1000
logicstats=0
highmem=0
highmem_slack=256
; the limiter spins (instead of sleeping) for the last margin_ms milliseconds of each frame
[limiter]
margin_ms=2
